[General]
sim-time-limit = 20s
output-scalar-file = results/${configname}.sca
output-vector-file = results/${configname}.vec
**.vector-recording = false

[Config NaiveScatter4]
network = ScatterFatTree4
sim-time-limit = 10s
*.algorithm = "naive"
*.payloadBytes = 1048576
*.linkBitrate = 1Gbps

[Config MPIScatter4]
network = ScatterFatTree4
sim-time-limit = 10s
*.algorithm = "mpi_scatter"
*.payloadBytes = 1048576
*.linkBitrate = 1Gbps

